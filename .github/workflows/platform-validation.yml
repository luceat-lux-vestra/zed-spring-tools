name: Platform Validation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: platform-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_LTS: "25"
  NODE_LTS: "24"
  RUST_TOOLCHAIN: "1.98.0"

jobs:
  scope:
    name: platform-scope
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      run_validation: ${{ steps.classify.outputs.run_validation }}
    steps:
      - name: Classify platform validation scope
        id: classify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_COUNT: ${{ github.event.pull_request.changed_files }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          run_validation=true

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "$IS_DRAFT" = "true" ]; then
            run_validation=false
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            changed="$RUNNER_TEMP/platform-changed-files.json"
            if ! [[ "$EXPECTED_COUNT" =~ ^[1-9][0-9]*$ ]]; then
              echo "::warning::Changed-file count is empty or malformed; running full platform validation."
            elif ! gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" > "$changed"; then
              echo "::warning::Could not establish the complete changed-file set; running full platform validation."
            else
              observed="$(jq '[.[][]] | length' "$changed")"
              if [ "$observed" -ne "$EXPECTED_COUNT" ]; then
                echo "::warning::Changed-file API returned $observed of $EXPECTED_COUNT files; running full platform validation."
              elif jq -e '
                [.[][] | .filename, (.previous_filename // "")]
                | any(
                    . == "Cargo.toml"
                    or . == "Cargo.lock"
                    or startswith(".cargo/")
                    or . == "rust-toolchain"
                    or . == "rust-toolchain.toml"
                    or startswith("src/")
                    or startswith("coordinator/")
                    or startswith("protocol/")
                    or . == "scripts/platform-validation.mjs"
                    or . == "scripts/platform-capability-probes.mjs"
                    or . == "scripts/run-coordinator-tests.mjs"
                    or . == "scripts/spring-runtime-smoke.mjs"
                    or . == ".github/workflows/platform-validation.yml"
                  )
              ' "$changed" >/dev/null; then
                run_validation=true
              else
                run_validation=false
              fi
            fi
          fi

          echo "run_validation=$run_validation" >> "$GITHUB_OUTPUT"
          echo "platform-validation=$run_validation"

  platform:
    needs: [scope]
    if: ${{ always() && (needs.scope.result != 'success' || needs.scope.outputs.run_validation == 'true') }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x86_64
            runner: ubuntu-24.04
            expected_os: linux
            expected_arch: x86_64
            rust_cache_key: platform-linux-x86_64
          - id: linux-arm64
            runner: ubuntu-24.04-arm
            expected_os: linux
            expected_arch: arm64
            # Reuse the already-proven required-CI main producer instead of
            # maintaining a duplicate Linux ARM64 platform cache.
            rust_cache_key: main-ci-rust-arm64
          - id: macos-x86_64
            runner: macos-15-intel
            expected_os: macos
            expected_arch: x86_64
            rust_cache_key: platform-macos-x86_64
          - id: macos-arm64
            runner: macos-15
            expected_os: macos
            expected_arch: arm64
            rust_cache_key: platform-macos-arm64
          - id: windows-x86_64
            runner: windows-2025
            expected_os: windows
            expected_arch: x86_64
            rust_cache_key: platform-windows-x86_64
          - id: windows-arm64
            runner: windows-11-arm
            expected_os: windows
            expected_arch: arm64
            rust_cache_key: platform-windows-arm64
    runs-on: ${{ matrix.runner }}
    env:
      EXPECTED_OS: ${{ matrix.expected_os }}
      EXPECTED_ARCH: ${{ matrix.expected_arch }}
      PLATFORM_EVIDENCE: ${{ github.workspace }}/platform-evidence.json
      SPRING_RUNTIME_EVIDENCE: ${{ github.workspace }}/spring-runtime-evidence.json
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        with:
          persist-credentials: false
      # Microsoft OpenJDK publishes the same current JDK 25 LTS line for all
      # six native tuples, including Windows ARM64. A single distribution keeps
      # this matrix comparable instead of silently dropping that tuple.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        with:
          distribution: microsoft
          java-version: ${{ env.JAVA_LTS }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        with:
          node-version: ${{ env.NODE_LTS }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        with:
          # Pull requests consume only protected-main caches. Writing
          # PR-scoped platform caches repeats archive work that the next PR
          # cannot reliably reuse.
          shared-key: ${{ matrix.rust_cache_key }}
          save-if: false
      - name: Record and verify native runner
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: node scripts/platform-validation.mjs
      - name: Check coordinator sources
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: |
          node --check coordinator/src/lsp.mjs
          node --check coordinator/src/main.mjs
          node --check scripts/run-coordinator-tests.mjs
          node --check scripts/platform-capability-probes.mjs
          node --check scripts/spring-runtime-smoke.mjs
      # Linux/macOS execute every existing coordinator contract directly. On
      # Windows, seven legacy tests whose fixtures themselves hard-code POSIX
      # paths or tight event-loop spins are replaced by proof-equivalent native
      # path + wall-clock probes; every platform-neutral contract still runs.
      # Test files are enumerated in Node so shell wildcard behaviour cannot
      # silently change coverage.
      - name: Coordinator capability contracts
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: node scripts/run-coordinator-tests.mjs
      # Download and checksum the exact canonical Spring Tools pin, verify every
      # required runtime file, then launch the real Spring Boot LS with the
      # production JVM argument vector and drive initialize/open/completion/
      # hover/shutdown over LSP. This is headless runtime evidence, not a claim
      # that Zed + official Java/JDT integration has been driven on this tuple.
      - name: Pinned Spring runtime smoke
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: node scripts/spring-runtime-smoke.mjs
      - name: Native Rust tests
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: cargo test --locked

      - name: Retain platform evidence
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (always()) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-evidence-${{ matrix.id }}-${{ env.SOURCE_HEAD_SHA }}
          path: |
            ${{ env.PLATFORM_EVIDENCE }}
            ${{ env.SPRING_RUNTIME_EVIDENCE }}
          if-no-files-found: warn
          retention-days: 14


  # Keep the declared JDK 21 floor continuously exercised against both real
  # pinned Java runtimes. One Linux x86_64 arm is sufficient here: the six-way
  # matrix above owns host portability while this job owns the JVM floor.
  # Intentionally preserve native Linux x86_64 JDK 21 runtime evidence as a
  # cross-architecture oracle: the six-tuple matrix runs x64 on JDK 25 only.
  # Changing this job to ARM64 would silently remove the x64 JDK 21 proof.
  spring-runtime-floor:
    needs: [scope]
    if: ${{ always() && (needs.scope.result != 'success' || needs.scope.outputs.run_validation == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SPRING_RUNTIME_EVIDENCE: ${{ github.workspace }}/spring-runtime-floor-evidence.json
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        with:
          node-version: ${{ env.NODE_LTS }}
      - name: Pinned Spring runtime smoke on JDK 21 floor
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: node scripts/spring-runtime-smoke.mjs
      - name: Retain JDK floor evidence
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (always()) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spring-runtime-floor-evidence-${{ env.SOURCE_HEAD_SHA }}
          path: |
            ${{ env.SPRING_RUNTIME_EVIDENCE }}
          if-no-files-found: warn
          retention-days: 14

  # Stable reusable-workflow result: non-applicable PRs return success without
  # fanning out expensive runners; applicable/manual runs fail unless every
  # native platform leg and the JDK 21 floor succeed.
  platform-gate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    needs:
      - scope
      - platform
      - spring-runtime-floor
    if: ${{ always() }}
    steps:
      - name: Platform validation not applicable
        if: ${{ needs.scope.result == 'success' && needs.scope.outputs.run_validation != 'true' }}
        run: echo "platform validation is not applicable to this pull request"

      - name: Confirm complete platform evidence
        if: ${{ needs.scope.result != 'success' || needs.scope.outputs.run_validation == 'true' }}
        env:
          PLATFORM_RESULT: ${{ needs.platform.result }}
          FLOOR_RESULT: ${{ needs.spring-runtime-floor.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$PLATFORM_RESULT" = "success"
          test "$FLOOR_RESULT" = "success"
          echo "all six native platform legs and the JDK 21 runtime floor passed"
