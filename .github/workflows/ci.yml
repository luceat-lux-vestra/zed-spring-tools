name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Least privilege: these checks only read the tree. Nothing here writes to the
# repository, so this token cannot be used to change it.
permissions:
  pull-requests: read # Needed to enumerate PR files for fail-closed docs-only routing.
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every third-party action below is pinned to a full-length commit SHA. A tag is
# a mutable pointer the action's owner can move after review, so a tag is not a
# supply-chain pin; the trailing comment is the human-readable version and
# Dependabot moves both together. `scripts/check-workflow-policy.mjs` fails this
# workflow if a mutable ref ever comes back.
#
# `rust`, `coordinator`, `review`, `workflow-security`, the reusable
# `platform-validation` result, and `codeql-runtime` are the authoritative components behind one
# required `Merge Gate`. The policy file
# records the exact component set so removing, renaming, or bypassing one cannot
# silently weaken the live merge contract.
jobs:
  rust:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      # Keep the rust-cache environment hash aligned with platform validation.
      RUST_TOOLCHAIN: "1.98.0"
    steps:
      - name: Detect documentation-only scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          changed="$RUNNER_TEMP/pr-changed-files.json"
          if ! gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" > "$changed"; then
            echo "::warning::Could not establish the changed-file set; using full validation."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! jq -e '[.[][]] | length > 0' "$changed" >/dev/null; then
            echo "::warning::Changed-file set is empty; using full validation."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if jq -e '
            [.[][] | .filename]
            | all(
                . == "README.md"
                or . == "CONTRIBUTING.md"
                or . == "AGENTS.md"
                or . == "SECURITY.md"
                or . == "CODE_OF_CONDUCT.md"
                or . == "COMPATIBILITY.md"
                or . == "LIMITATIONS.md"
                or test("^docs/.*[.]md$")
              )
          ' "$changed" >/dev/null; then
            docs_only=true
          else
            docs_only=false
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs-only=$docs_only"

      - name: Documentation-only fast path
        if: ${{ steps.scope.outputs.docs_only == 'true' }}
        run: echo "Documentation-only change; product build/test/toolchain work is not applicable."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        with:
          persist-credentials: false
      # Java 21 is intentional here: this required job proves the declared JDK
      # floor. M5 platform validation separately drives the latest LTS, JDK 25.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        with:
          distribution: temurin
          java-version: "21"
      # Pinned by SHA *and* by toolchain version. `@stable` floats twice over:
      # the action's own code moves, and the compiler it installs changes every
      # six weeks, which turns `clippy -D warnings` into a check that can fail on
      # an unchanged tree the day a new lint ships. The extension registry builds
      # the shipped WASM on its own toolchain, so this pin governs CI only; move
      # it deliberately, with a run that proves the new compiler is clean.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        with:
          # Reuse the same Cargo/toolchain cache family produced on protected
          # main. A pull request is strictly restore-only.
          shared-key: main-ci-rust-arm64
          save-if: false
      - name: Format
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        run: cargo fmt --check
      - name: Clippy
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        run: cargo test --locked
      - name: Build WASM release
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        run: cargo build --locked --release --target wasm32-wasip2

  coordinator:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Detect documentation-only scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          changed="$RUNNER_TEMP/pr-changed-files.json"
          if ! gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" > "$changed"; then
            echo "::warning::Could not establish the changed-file set; using full validation."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! jq -e '[.[][]] | length > 0' "$changed" >/dev/null; then
            echo "::warning::Changed-file set is empty; using full validation."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if jq -e '
            [.[][] | .filename]
            | all(
                . == "README.md"
                or . == "CONTRIBUTING.md"
                or . == "AGENTS.md"
                or . == "SECURITY.md"
                or . == "CODE_OF_CONDUCT.md"
                or . == "COMPATIBILITY.md"
                or . == "LIMITATIONS.md"
                or test("^docs/.*[.]md$")
              )
          ' "$changed" >/dev/null; then
            docs_only=true
          else
            docs_only=false
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs-only=$docs_only"

      - name: Documentation-only fast path
        if: ${{ steps.scope.outputs.docs_only == 'true' }}
        run: echo "Documentation-only change; product build/test/toolchain work is not applicable."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        with:
          fetch-depth: 0
          persist-credentials: false
      # Node 24 is the current LTS line and is also the M5 platform baseline.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        with:
          node-version: 24
      # Use the same explicit cross-platform discovery path as the six-tuple
      # platform matrix so adding a new coordinator test cannot diverge between
      # required CI and portability CI.
      - name: Coordinator tests
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        run: node scripts/run-coordinator-tests.mjs
      - name: Repository check tests
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        run: node --test scripts/test/*.test.mjs
      - name: Case-insensitive path collisions
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        run: node scripts/check-case-collisions.mjs
      - name: Contributors list is current
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        run: node scripts/generate-contributors.mjs --check
      # A dependency bump changes the locked package count and the direct
      # dependency versions that THIRD_PARTY_NOTICES.md states, and the notice
      # is what a user reads about the redistributed WASM. Fail the bump, not
      # the release.
      - name: Third-party notices are current
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        run: node scripts/check-third-party-notices.mjs
      # The pinned Spring Tools identity is retyped across the extension
      # manifest, the Rust adapter, the coordinator and the notices. This runs
      # inside an already-required context so a half-applied release pin cannot
      # merge, rather than surfacing at a user's install.
      - name: Spring Tools pin inventory reconciles
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        run: node scripts/check-pin-inventory.mjs

  # Fail-closed workflow policy. Both tools are fetched by exact version and
  # verified against a recorded SHA-256 before they run: a policy checker that
  # silently installed whatever the release page serves today would be the same
  # unpinned-input problem it exists to catch.
  #
  # This job carries no path filter and no `if:`, so it is emitted on every
  # ordinary pull request. That is a precondition for promoting it to a required
  # context later; see `.github/merge-gate-policy.json`.
  workflow-security:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        with:
          persist-credentials: false
      # Keep repository policy checks on the same current Node LTS baseline.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        with:
          node-version: 24
      # Avoid a per-PR dependency on GitHub Release asset delivery. actionlint
      # is built from its exact upstream release commit via the Go module checksum
      # pipeline; zizmor is installed only from its hash-pinned PyPI ARM64 wheel.
      - name: Install actionlint and zizmor
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_REV: 914e7df21a07ef503a81201c76d2b11c789d3fca
          ZIZMOR_VERSION: 1.30.0
          ZIZMOR_WHEEL_SHA256: 7569a58319fb270c14a64663a6565929035f26f6f6d13059314f796e988129eb
        run: |
          set -euo pipefail
          tools_dir="${RUNNER_TEMP}/policy-tools"
          zizmor_venv="${RUNNER_TEMP}/policy-zizmor"
          mkdir -p "${tools_dir}"

          GOBIN="${tools_dir}" go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_REV}"

          python3 -m venv "${zizmor_venv}"
          printf 'zizmor==%s --hash=sha256:%s\n' "${ZIZMOR_VERSION}" "${ZIZMOR_WHEEL_SHA256}" > "${RUNNER_TEMP}/zizmor-requirements.txt"
          "${zizmor_venv}/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-deps \
            --only-binary=:all: \
            --require-hashes \
            --retries 4 \
            --timeout 20 \
            -r "${RUNNER_TEMP}/zizmor-requirements.txt"
          ln -s "${zizmor_venv}/bin/zizmor" "${tools_dir}/zizmor"

          "${tools_dir}/actionlint" -version
          "${tools_dir}/zizmor" --version
          echo "${tools_dir}" >> "${GITHUB_PATH}"
      - name: actionlint
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: actionlint
      # `--no-online-audits` keeps this offline and tokenless. Every finding
      # fails: the tree is clean today, so a suppression must be written down as
      # a `# zizmor: ignore[...]` comment next to the reason, not absorbed by a
      # severity threshold.
      - name: zizmor
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: zizmor --no-online-audits --format plain .github/workflows/
      - name: Merge-gate and workflow policy
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: node scripts/check-workflow-policy.mjs
      - name: CodeQL original SARIF verdict negative controls
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: python3 .github/scripts/release-codeql-verdict.py --self-test
      - name: Four-language exact-SHA release CodeQL reuse/dispatch/join state-machine tests
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: python3 tools/ci/release_codeql_preflight.py --self-test
      - name: Issue metadata policy
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: node --test scripts/test-issue-metadata.mjs


  review:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        with:
          fail-on-severity: moderate

  codeql-runtime:
    name: codeql-runtime
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 12
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Draft final-gate placeholder
        if: ${{ github.event.pull_request.draft }}
        run: echo "CodeQL runtime compatibility validation is deferred until the pull request is ready for review."

      - name: Classify selective CodeQL runtime from trusted base
        id: codeql_runtime_scope
        if: ${{ github.event.pull_request.draft == false }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          echo 'required=true' >> "$GITHUB_OUTPUT"
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::missing immutable PR base/head identity"
            exit 1
          }

          trusted="$RUNNER_TEMP/trusted-codeql-runtime-validation.py"
          encoded="$RUNNER_TEMP/trusted-codeql-runtime-validation.b64"
          if ! gh api -H 'Accept: application/vnd.github+json' \
            "repos/$REPO/contents/.github/scripts/trusted-codeql-runtime-validation.py?ref=$BASE_SHA" \
            --jq '.content' > "$encoded" 2>/dev/null; then
            echo "Protected base predates the CodeQL runtime classifier; requiring the real probe."
            exit 0
          fi
          tr -d '\n' < "$encoded" | base64 --decode > "$trusted"
          test -s "$trusted"

          pr_json="$RUNNER_TEMP/codeql-runtime-pr.json"
          pages="$RUNNER_TEMP/codeql-runtime-pages"
          files_json="$RUNNER_TEMP/codeql-runtime-files.json"
          mkdir -p "$pages"
          gh api -H 'Accept: application/vnd.github+json' "repos/$REPO/pulls/$PR_NUMBER" > "$pr_json"

          complete=false
          for page in $(seq 1 30); do
            page_file="$pages/page-$(printf '%02d' "$page").json"
            gh api -H 'Accept: application/vnd.github+json' \
              "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100&page=$page" > "$page_file"
            count="$(jq -er 'if type == "array" then length else error("invalid file page") end' "$page_file")"
            if [ "$count" -lt 100 ]; then
              complete=true
              break
            fi
          done
          [ "$complete" = true ] || {
            echo "::error::changed-file pagination exceeded the supported 3000-file bound"
            exit 1
          }
          jq -s '.' "$pages"/page-*.json > "$files_json"

          python3 "$trusted" classify \
            --pr-json "$pr_json" \
            --files-json "$files_json" \
            --repo "$REPO" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --head-repo "$HEAD_REPO" \
            --github-output "$GITHUB_OUTPUT"

      - name: Non-applicable CodeQL runtime fast path
        if: ${{ github.event.pull_request.draft == false && steps.codeql_runtime_scope.outcome == 'success' && steps.codeql_runtime_scope.outputs.required == 'false' }}
        run: echo "Trusted-base classification proved the CodeQL runtime compatibility probe is not applicable."

      - name: Check out exact PR head for CodeQL runtime
        if: ${{ github.event.pull_request.draft == false && steps.codeql_runtime_scope.outcome == 'success' && steps.codeql_runtime_scope.outputs.required == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify selective CodeQL runtime contract
        if: ${{ github.event.pull_request.draft == false && steps.codeql_runtime_scope.outcome == 'success' && steps.codeql_runtime_scope.outputs.required == 'true' }}
        run: |
          python3 .github/scripts/trusted-codeql-runtime-validation.py self-test
          python3 .github/scripts/trusted-codeql-runtime-validation.py check-contract

      - name: Initialize PR-only CodeQL runtime
        if: ${{ github.event.pull_request.draft == false && steps.codeql_runtime_scope.outcome == 'success' && steps.codeql_runtime_scope.outputs.required == 'true' }}
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: actions
          build-mode: none

      - name: Analyze PR-only CodeQL runtime without upload
        if: ${{ github.event.pull_request.draft == false && steps.codeql_runtime_scope.outcome == 'success' && steps.codeql_runtime_scope.outputs.required == 'true' }}
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:actions"
          upload: never
          output: ${{ runner.temp }}/pr-codeql-runtime

      - name: Verify local PR-only CodeQL SARIF and reject promotion
        if: ${{ github.event.pull_request.draft == false && steps.codeql_runtime_scope.outcome == 'success' && steps.codeql_runtime_scope.outputs.required == 'true' }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SARIF_DIR: ${{ runner.temp }}/pr-codeql-runtime
        run: python3 .github/scripts/trusted-codeql-runtime-validation.py verify --sarif-dir "$SARIF_DIR" --head "$HEAD_SHA"

  platform-validation:
    name: Platform Validation
    uses: ./.github/workflows/platform-validation.yml # zizmor: ignore[self-repository] actionlint 1.7.12 rejects GitHub's newer $/ self-repository syntax.

  merge-gate:
    name: Merge Gate
    needs: [rust, coordinator, review, workflow-security, platform-validation, codeql-runtime]
    if: ${{ always() }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Require every merge-gate component to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for name in rust coordinator review workflow-security platform-validation codeql-runtime; do
            result="$(jq -r --arg name "$name" '.[$name].result // "missing"' <<<"$NEEDS_JSON")"
            if [ "$result" != "success" ]; then
              echo "::error::$name concluded '$result'; Merge Gate remains closed."
              failed=1
            fi
          done
          exit "$failed"
