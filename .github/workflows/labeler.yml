name: Labeler

# `pull_request` keeps the workflow on the reviewed pull-request revision and
# avoids granting a privileged token to workflow code from a fork. Forks are
# intentionally skipped because their token cannot write labels.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          # Additive only. The maintainer's own metadata is never removed.
          sync-labels: false
