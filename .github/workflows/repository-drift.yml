# Scheduled, read-mostly repository drift audit. It reports policy/settings
# drift but never edits issues, branches, releases, or artifacts.

name: Repository drift audit

on:
  schedule:
    - cron: '37 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-drift-audit
  cancel-in-progress: true

jobs:
  audit:
    name: Repository drift audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Reconcile live repository policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-workflow-policy.mjs --live
      - name: Reconcile Spring Tools pin inventory
        run: node scripts/check-pin-inventory.mjs
      - name: Reconcile third-party notices
        run: node scripts/check-third-party-notices.mjs
