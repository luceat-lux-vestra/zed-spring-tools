name: D007 Standalone Debug

on:
  push:
    branches:
      - fix-159-standalone-spring-ls

permissions:
  contents: read

concurrency:
  group: d007-standalone-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standalone:
    # Full live-data acceptance relies on the 5.3 PID/local-attach path. Linux\n    # hosted runners cannot reliably return that local JMX payload; use the same\n    # macOS arm64 runner already covered by Platform Validation instead of\n    # reintroducing the RMI arguments that Spring Tools 5.3 intentionally removed.\n    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Validate D007 harness contracts
        run: |
          node --test \
            scripts/test/d007-standalone-capability-regression.test.mjs \
            scripts/test/d007-capability-acceptance.test.mjs
      - name: Run D007 standalone regression
        run: |
          mkdir -p tmp
          node scripts/d007-standalone-capability-regression.mjs \
            "tmp/d007-standalone-${GITHUB_SHA}.json" \
            "$JAVA_HOME"
      - name: Print D007 standalone evidence
        if: ${{ always() }}
        run: |
          evidence="tmp/d007-standalone-${GITHUB_SHA}.json"
          if [ -f "$evidence" ]; then
            cat "$evidence"
          else
            echo "No standalone evidence file produced"
          fi

      - name: Upload D007 standalone evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: d007-standalone-${{ github.sha }}
          path: tmp/d007-standalone-${{ github.sha }}.json
          if-no-files-found: warn
