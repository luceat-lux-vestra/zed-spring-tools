name: Rust platform main cache seed

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'rust-toolchain'
      - 'rust-toolchain.toml'
      - '.github/workflows/platform-validation.yml'
      - '.github/workflows/rust-platform-main-cache-seed.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-platform-main-cache-seed
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: "1.98.0"

jobs:
  prime:
    name: Prime platform Rust cache (${{ matrix.id }})
    if: ${{ github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x86_64
            runner: ubuntu-24.04
            rust_cache_key: platform-linux-x86_64
          - id: macos-x86_64
            runner: macos-15-intel
            rust_cache_key: platform-macos-x86_64
          - id: macos-arm64
            runner: macos-15
            rust_cache_key: platform-macos-arm64
          - id: windows-x86_64
            runner: windows-2025
            rust_cache_key: platform-windows-x86_64
          - id: windows-arm64
            runner: windows-11-arm
            rust_cache_key: platform-windows-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify exact trusted main SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Restore and prime platform Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ matrix.rust_cache_key }}
      - name: Compile the native platform test dependency graph
        run: cargo test --locked
