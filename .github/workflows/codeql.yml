name: CodeQL

# Code scanning is free for public repositories. Four of this repository's
# languages are analysable and each one is real attack surface:
#
# - `actions`   the workflows themselves, which run with repository credentials;
# - `javascript-typescript` the coordinator, which speaks LSP over stdio and
#                   spawns the Spring language server;
# - `java-kotlin`   the bridge that the official Java extension's JDT LS loads;
# - `rust`        the extension adapter compiled into the distributed WASM.
#
# Every language uses `build-mode: none`: nothing here needs a build to be
# analysed, and CodeQL must not become a second, divergent build of the product.
# Findings land in the repository's Security tab, not as a merge gate.

on:
  push:
    branches: [main]
  pull_request:
    # A documentation-only pull request changes no analysed source. Research,
    # decision, and spike documents are the bulk of this repository's traffic.
    paths-ignore:
      - "**/*.md"
      - docs/**
  schedule:
    # Weekly, so a newly published query or advisory reaches this code even
    # during a stretch of documentation-only work.
    - cron: "27 5 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - javascript-typescript
          - java-kotlin
          - rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Rust extractor requires `cargo` to resolve the manifest. The image
      # ships a toolchain, but pinning it puts this job on the exact compiler the
      # `rust` CI job uses instead of whatever the image happens to carry, so a
      # CodeQL finding and a clippy finding refer to the same rustc.
      - if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.98.0"
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:${{ matrix.language }}
