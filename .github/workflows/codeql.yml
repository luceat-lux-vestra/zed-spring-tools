name: CodeQL

# Code scanning is free for public repositories. Four of this repository's
# languages are analysable and each one is real attack surface:
#
# - `actions`   the workflows themselves, which run with repository credentials;
# - `javascript-typescript` the coordinator, which speaks LSP over stdio and
#                   spawns the Spring language server;
# - `java-kotlin`   the bridge that the official Java extension's JDT LS loads;
# - `rust`        the extension adapter compiled into the distributed WASM.
#
# Every language uses `build-mode: none`: nothing here needs a build to be
# analysed, and CodeQL must not become a second, divergent build of the product.
# Findings land in the repository's Security tab, not as a merge gate.

on:
  push:
    branches: [main]
  pull_request:
    # A documentation-only pull request changes no analysed source. Research,
    # decision, and spike documents are the bulk of this repository's traffic.
    paths-ignore:
      - "**/*.md"
      - docs/**
  schedule:
    # Weekly, so a newly published query or advisory reaches this code even
    # during a stretch of documentation-only work.
    - cron: "27 5 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - javascript-typescript
          - java-kotlin
          - rust
    steps:
      - uses: actions/checkout@v7
      # The Rust extractor requires `cargo` to resolve the manifest. The image
      # ships a toolchain, but pinning it keeps this job on the same stable
      # channel the CI build uses instead of whatever the image happens to carry.
      - if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@stable
      - uses: github/codeql-action/init@v4.37.6
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4.37.6
        with:
          category: /language:${{ matrix.language }}
