name: Failure triage

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] metadata-only; no checkout, no PR-controlled code, read-only token
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - edited

permissions:
  contents: read

concurrency:
  group: failure-triage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  failure-triage:
    name: failure-triage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate failure-remediation declaration
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys

          START = "<!-- failure-triage:v1:start -->"
          END = "<!-- failure-triage:v1:end -->"
          NOT_REMEDIATION = "Not remediation for an observed failure"
          REMEDIATION = "Remediation for an observed failure"
          FIELDS = ["Observed", "Classification", "Basis", "Root cause", "Remediation", "Proof"]
          ALLOWED = {
              "implementation defect",
              "test defect",
              "evidence defect",
              "workflow-policy drift",
              "environment failure",
          }
          SENTINELS = {
              "unknown",
              "unverified",
              "insufficient evidence",
              "tbd",
              "todo",
              "n/a",
              "na",
              "none",
          }

          class TriageError(ValueError):
              pass

          def clean(value: str) -> str:
              value = re.sub(r"<!--.*?-->", "", value, flags=re.DOTALL)
              return value.strip().strip(chr(96)).strip()

          def checked(block: str, label: str) -> bool:
              pattern = rf"(?im)^\s*-\s*\[(?P<mark>[ xX])\]\s*{re.escape(label)}\s*$"
              matches = list(re.finditer(pattern, block))
              if len(matches) != 1:
                  raise TriageError(f"expected exactly one checkbox for: {label}")
              return matches[0].group("mark").lower() == "x"

          def field_values(block: str):
              matches = {}
              for field in FIELDS:
                  found = list(re.finditer(rf"(?m)^{re.escape(field)}:\s*$", block))
                  if len(found) != 1:
                      raise TriageError(f"expected exactly one '{field}:' field")
                  matches[field] = found[0]

              ordered = [matches[field].start() for field in FIELDS]
              if ordered != sorted(ordered):
                  raise TriageError("triage fields are out of canonical order")

              values = {}
              for index, field in enumerate(FIELDS):
                  start = matches[field].end()
                  end = matches[FIELDS[index + 1]].start() if index + 1 < len(FIELDS) else len(block)
                  values[field] = clean(block[start:end])
              return values

          def validate(body: str, author_type: str) -> str:
              if author_type == "Bot" and START not in body and END not in body:
                  return "bot-exempt"

              if body.count(START) != 1 or body.count(END) != 1:
                  raise TriageError("missing or duplicated failure-triage v1 block")
              start = body.index(START) + len(START)
              end = body.index(END)
              if start >= end:
                  raise TriageError("failure-triage markers are out of order")

              block = body[start:end]
              not_remediation = checked(block, NOT_REMEDIATION)
              remediation = checked(block, REMEDIATION)
              if not_remediation == remediation:
                  raise TriageError("select exactly one remediation declaration")

              if not_remediation:
                  return "not-remediation"

              values = field_values(block)
              for field, value in values.items():
                  if not value:
                      raise TriageError(f"{field} is required for remediation")
                  if value.casefold() in SENTINELS:
                      raise TriageError(f"{field} remains fail-closed: {value}")

              classification = values["Classification"].casefold()
              if classification not in ALLOWED:
                  raise TriageError(
                      "Classification must be exactly one canonical non-UNKNOWN class: "
                      + ", ".join(sorted(ALLOWED))
                  )
              if values["Root cause"].casefold() in SENTINELS:
                  raise TriageError("Root cause is not established; remediation remains blocked")

              return f"remediation:{classification}"

          def expect_ok(name: str, body: str, author_type: str = "User") -> None:
              try:
                  validate(body, author_type)
              except TriageError as exc:
                  raise SystemExit(f"self-test {name} unexpectedly failed: {exc}")

          def expect_fail(name: str, body: str, author_type: str = "User") -> None:
              try:
                  validate(body, author_type)
              except TriageError:
                  return
              raise SystemExit(f"self-test {name} unexpectedly passed")

          non_remediation = f"""\
          {START}
          - [x] {NOT_REMEDIATION}
          - [ ] {REMEDIATION}
          {END}
          """
          valid_remediation = f"""\
          {START}
          - [ ] {NOT_REMEDIATION}
          - [x] {REMEDIATION}

          Observed:
          required CI failed on exact run 123 for revision abc

          Classification:
          implementation defect

          Basis:
          reproduction isolates product behavior; test and runner controls remain unchanged

          Root cause:
          retry state was committed before the business transaction completed

          Remediation:
          move the state transition into the owning transaction boundary

          Proof:
          rerun the failing regression, recovery case, and exact-head required CI
          {END}
          """
          unknown_remediation = valid_remediation.replace(
              "implementation defect", "UNKNOWN"
          )
          unresolved_root = valid_remediation.replace(
              "retry state was committed before the business transaction completed",
              "UNKNOWN",
          )

          expect_ok("non-remediation", non_remediation)
          expect_ok("valid-remediation", valid_remediation)
          expect_ok("bot-without-template", "", "Bot")
          expect_fail("missing-block", "")
          expect_fail("unknown-classification", unknown_remediation)
          expect_fail("unknown-root-cause", unresolved_root)
          expect_fail(
              "ambiguous-selection",
              non_remediation.replace(f"- [ ] {REMEDIATION}", f"- [x] {REMEDIATION}"),
          )

          body = os.environ.get("PR_BODY") or ""
          author_type = os.environ.get("PR_AUTHOR_TYPE") or ""
          try:
              result = validate(body, author_type)
          except TriageError as exc:
              print(f"failure triage: FAIL: {exc}", file=sys.stderr)
              raise SystemExit(1)

          print(f"failure triage: PASS ({result})")
          PY
