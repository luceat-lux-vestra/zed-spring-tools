name: Rust main cache seed

# A trusted-main writer for the already-required Linux ARM64 Rust job.
# Do not prime six separate platform cache families without measured ROI.
on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'rust-toolchain'
      - 'rust-toolchain.toml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/rust-main-cache-seed.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-main-cache-seed
  cancel-in-progress: false

env:
  # Must match CI/rust and platform-validation Linux ARM64 before rust-cache.
  RUST_TOOLCHAIN: "1.98.0"

jobs:
  rust:
    name: Prime main Rust compiler dependencies
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify exact trusted main SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - name: Restore and prime shared Rust dependency cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Exactly the same action, toolchain and cache identity as CI/rust.
          shared-key: main-ci-rust-arm64
      - name: Compile the exact required Rust dependency graph
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --locked
          cargo build --locked --release --target wasm32-wasip2
