name: Dependency review

# Free for public repositories, and it answers a question this project already
# answers by hand in THIRD_PARTY_NOTICES.md: what does a pull request add to the
# set of packages redistributed inside the registry-built `extension.wasm`?
#
# It reports the dependency diff and fails on a known vulnerability at moderate
# or higher. Permissions stay read-only, so no summary comment is posted: a
# Dependabot pull request runs with a read-only token and a comment step would
# fail there rather than report. The diff is in the job summary.

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
