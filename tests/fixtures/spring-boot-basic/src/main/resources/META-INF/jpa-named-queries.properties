# Spring Data reads named queries from this exact file. Spring Tools treats it
# as the `jpa-query-properties` language, which routes values through
# NamedQueryPropertiesReconcileEngine. Because this fixture has spring-data-jpa,
# the reconciler selects the HQL grammar for project-aware validation.
Greeting.findAllOrdered=select g from Greeting g order by g.message
Greeting.findByMessage=select g from Greeting g where g.message = ?1

# Deliberately incomplete in the same proven shape as DataQuerySample:
# a trailing `where` has no predicate and must produce HQL_SYNTAX.
Greeting.broken=select g from Greeting g where
